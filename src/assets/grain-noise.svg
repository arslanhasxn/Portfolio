<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    Static fractal noise tile — rasterized once when used as background-image.
    Tune: baseFrequency (grain scale), numOctaves (detail), feColorMatrix (contrast).
  -->
  <filter id="grain" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence
      type="fractalNoise"
      baseFrequency="0.75"
      numOctaves="3"
      stitchTiles="stitch"
      result="noise"
    />
    <feColorMatrix
      in="noise"
      type="matrix"
      values="0.33 0.33 0.33 0 0
              0.33 0.33 0.33 0 0
              0.33 0.33 0.33 0 0
              0    0    0    1 0"
      result="grain"
    />
  </filter>
  <rect width="100%" height="100%" filter="url(#grain)" />
</svg>
